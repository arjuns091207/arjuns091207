
name: Update Tulkun

on:
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  tulkun:
    runs-on: ubuntu-latest
    steps:
      - uses: PramudithaN/git-tulkun@v1
        with:
          login: arjuns091207
          view: side
          window: annual
          canon: "false"
          output-dir: tulkun
          commit: "true"
          branch: output
